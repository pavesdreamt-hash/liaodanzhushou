  <script>
    (() => {
      const root = document.getElementById('chat-workbench-aligned');
      const list = root.querySelector('#cw-task-list');
      const resultCount = root.querySelector('#cw-result-count');
      const messages = root.querySelector('#cw-messages');
      const showTranslation = root.querySelector('#cw-show-translation');
      const modeNote = root.querySelector('#cw-mode-note');
      const replyPreview = root.querySelector('#cw-reply-preview');
      const input = root.querySelector('#cw-input');
      const toast = root.querySelector('#cw-toast');
      const prior = window.openai && window.openai.widgetState && window.openai.widgetState.privateContent;
      const state = {
        filter: prior && prior.filter ? prior.filter : 'all',
        selected: prior && prior.selected ? prior.selected : '',
        mode: prior && prior.mode ? prior.mode : 'manual',
        previewOpen: prior && typeof prior.previewOpen === 'boolean' ? prior.previewOpen : true,
        accent: '#7c3aed',
        density: '舒适'
      };
      const customers = [];

      function esc(value) {
        return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      }

      function currentCustomer() {
        return customers.find(customer => customer.id === state.selected) || customers[0] || null;
      }

      function persist() {
        if (window.openai && window.openai.setWidgetState) {
          window.openai.setWidgetState({
            modelContent: { selectedQueue: state.filter, selectedOrder: currentCustomer()?.ref || '', replyMode: state.mode },
            privateContent: { filter: state.filter, selected: state.selected, mode: state.mode, previewOpen: state.previewOpen }
          }).catch(() => {});
        }
      }

      function renderList() {
        root.style.setProperty('--cw-accent', state.accent);
        root.style.setProperty('--cw-row-pad', state.density === '紧凑' ? '9px' : '13px');
        const visible = state.filter === 'all' ? customers : state.filter === 'attention' ? customers.filter(customer => customer.attention) : customers.filter(customer => customer.filter === state.filter);
        resultCount.textContent = `${visible.length} 项`;
        list.innerHTML = visible.length ? visible.map(customer => `
          <article class="cw-task-row" data-selected="${customer.id === state.selected}">
            <button class="cw-row-main cursor-interaction" type="button" data-customer="${esc(customer.id)}" aria-label="打开${esc(customer.name)}的聊天">
              <span class="cw-row-person"><span class="cw-avatar">${esc(customer.initial)}</span><span class="cw-person-copy"><span class="cw-phone-line"><span class="cw-phone-number">${esc(customer.phone)}</span>${customer.unread ? `<span class="cw-unread" aria-label="${customer.unread}条未读消息">${customer.unread}</span>` : ''}</span><span class="cw-order-ref">${esc(customer.ref)}</span></span></span>
              <span class="cw-row-message"><span class="cw-message-title">${esc(customer.title)}</span><span class="cw-message-preview">${esc(customer.preview)}</span><span class="cw-source"><i data-lucide="${customer.sourceIcon}" aria-hidden="true"></i>${esc(customer.source)}</span></span>
              <span class="cw-row-status"><span class="cw-status-pill ${customer.statusClass}"><i data-lucide="${customer.statusIcon}" aria-hidden="true"></i>${esc(customer.status)}</span><span class="cw-status-time">${esc(customer.time)}</span></span>
            </button>
            <span class="cw-row-actions"><button class="cw-open cw-detail cursor-interaction" type="button" data-customer="${esc(customer.id)}" data-action="detail">订单详情</button></span>
          </article>`).join('') : '<div class="cw-empty">暂无真实订单或待办。请在右侧关联已确认的 WhatsApp 聊天。</div>';
        root.querySelectorAll('.cw-tab').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.filter === state.filter)));
        root.querySelectorAll('.cw-stat').forEach(stat => stat.setAttribute('aria-pressed', String(stat.dataset.filter === state.filter)));
        if (globalThis.lucide) lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function renderPhone() {
        if (root.classList.contains('manual-live')) return;
        const customer = currentCustomer();
        if (!customer) {
          root.querySelector('#cw-phone-avatar').textContent = '?';
          root.querySelector('#cw-contact-phone').textContent = '未关联客户';
          root.querySelector('#cw-contact-order').textContent = '连接并核对 WhatsApp 聊天';
          messages.innerHTML = '<div class="cw-empty">关联真实聊天后显示消息</div>';
          return;
        }
        root.querySelector('#cw-phone-avatar').textContent = customer.initial;
        root.querySelector('#cw-contact-phone').textContent = customer.phone;
        root.querySelector('#cw-contact-order').textContent = `${customer.name} · ${customer.ref}`;
        messages.innerHTML = `<span class="cw-day">今天 · 当前订单</span>` + customer.chat.map(message => {
          const sender = message.side === 'in' ? '客户' : message.sender === 'AI自动发送' ? 'AI自动发送' : '人工发送';
          return `<div class="cw-message ${message.side === 'out' ? 'outgoing' : ''}">
            <article class="cw-bubble cw-bubble-${message.side}">
              <p class="cw-original">${esc(message.text)}</p>
              <div class="cw-message-meta"><span><i data-lucide="${sender === 'AI自动发送' ? 'bot' : 'user-round'}" aria-hidden="true"></i>${sender}</span><span class="cw-bubble-time">${esc(message.time)}</span></div>
            </article>
            <p class="cw-translation">${esc(message.zh)}</p>
          </div>`;
        }).join('');
        if (globalThis.lucide) globalThis.lucide.createIcons({ nodes: [messages], attrs: { width: 13, height: 13 } });
        messages.scrollTop = messages.scrollHeight;
      }

      function renderMode() {
        root.querySelectorAll('.cw-mode').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode)));
        const settings = {
          manual: { note: '由你接待 · 自动回复已暂停', preview: '', placeholder: '输入中文，翻译后预览…' },
          assist: { note: 'AI辅助 · 生成后由你确认发送', preview: 'AI会根据聊天和订单资料生成英文草稿，发送前仍由你确认。', placeholder: '用中文写下想回复的意思…' },
          auto: { note: 'AI自动 · 当前仅展示规划状态', preview: '自动回复开启前，需要先设置允许范围、置信度和人工接管规则。', placeholder: '自动模式下可随时人工接管…' }
        };
        const active = settings[state.mode];
        modeNote.textContent = active.note;
        replyPreview.textContent = active.preview;
        input.placeholder = active.placeholder;
      }

      function renderAll() {
        root.classList.toggle('cw-preview-collapsed', !state.previewOpen);
        renderList();
        renderPhone();
        renderMode();
      }

      let toastTimer;
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('is-visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
      }

      root.addEventListener('click', event => {
        const filter = event.target.closest('[data-filter]');
        if (filter) { state.filter = filter.dataset.filter; renderList(); persist(); }
        const customer = event.target.closest('[data-customer]');
        if (customer) {
          state.selected = customer.dataset.customer;
          if (customer.dataset.action !== 'detail') state.previewOpen = true;
          renderAll();
          persist();
          if (customer.dataset.action === 'detail' && currentCustomer()) showToast(`进入 ${currentCustomer().ref} 的订单详情页`);
        }
        const mode = event.target.closest('[data-mode]');
        if (mode) { state.mode = mode.dataset.mode; renderMode(); persist(); }
        const notice = event.target.closest('[data-toast]');
        if (notice) showToast(notice.dataset.toast);
        if (event.target.closest('.cw-close-preview')) {
          state.previewOpen = false;
          renderAll();
          persist();
        }
      });
      showTranslation.addEventListener('change', renderPhone);
      root.querySelector('.cw-send').addEventListener('click', () => {
        if (!input.value.trim()) { showToast(state.mode === 'assist' ? '先用中文写下你想回复的意思' : '先输入回复内容'); return; }
        showToast('先生成英文预览，确认后再发送');
      });
      window.addEventListener('openai:set_globals', event => {
        const next = event.detail && event.detail.globals && event.detail.globals.widgetState && event.detail.globals.widgetState.privateContent;
        if (next) {
          if (next.filter) state.filter = next.filter;
          if (next.selected) state.selected = next.selected;
          if (next.mode) state.mode = next.mode;
          if (typeof next.previewOpen === 'boolean') state.previewOpen = next.previewOpen;
          renderAll();
        }
      });
      renderAll();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: renderAll });
        tweak.addColorPicker(state, 'accent', { label: '强调色', reference: '--cw-accent' });
        tweak.addSelect(state, 'density', { label: '列表密度', reference: 'queue.density', options: ['舒适', '紧凑'] });
      }
    })();
  </script>
</div>
